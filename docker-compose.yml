# ─────────────────────────────────────────────────────────────
# Optional: Local PostgreSQL for development
# Usage:  docker compose up -d
# ─────────────────────────────────────────────────────────────
services:
  postgres:
    image: postgres:16-alpine
    container_name: evalia-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: evalia
      POSTGRES_PASSWORD: evalia
      POSTGRES_DB: evalia
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evalia -d evalia"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://evalia:evalia@postgres:5432/evalia
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-compose-development-secret-change-me}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-}
      AGENT_BASE_URL: ${AGENT_BASE_URL:-}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      COPILOT_PROXY_API_KEY: ${COPILOT_PROXY_API_KEY:-not-needed}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      AI_INTERVIEW_NOTICE_VERSION: ${AI_INTERVIEW_NOTICE_VERSION:-ai-interview-v1}
      JUDGE0_URL: ${JUDGE0_URL:-}
      JUDGE0_TOKEN: ${JUDGE0_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.worker.job_worker"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://evalia:evalia@postgres:5432/evalia
      JWT_SECRET: ${JWT_SECRET:-compose-development-secret-change-me}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-}
      AGENT_BASE_URL: ${AGENT_BASE_URL:-}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      COPILOT_PROXY_API_KEY: ${COPILOT_PROXY_API_KEY:-not-needed}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      AI_INTERVIEW_NOTICE_VERSION: ${AI_INTERVIEW_NOTICE_VERSION:-ai-interview-v1}
      JUDGE0_URL: ${JUDGE0_URL:-}
      JUDGE0_TOKEN: ${JUDGE0_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
